StylesPath = vale/styles
MinAlertLevel = warning
Vocab = WyriHaximus
Packages = https://github.com/jdkato/diataxis/releases/download/v0.1.0/Diataxis.zip, \
           https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip, \
           https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip, \
           https://github.com/vale-cli/proselint/releases/download/v0.4.0/proselint.zip, \
           https://github.com/vale-cli/alex/releases/download/v0.3.0/alex.zip, \
           https://github.com/a11yfred/neighbor/releases/download/v2.2.0/neighbor.zip, \
           https://github.com/jdkato/a11y/releases/download/v0.1.0/A11y.zip, \
           https://github.com/krishnasunkam/vale-ai-tells/releases/download/v1.0.0/AiTells.zip

[formats]
php = md
js = md
ts = md
yaml = md
yml = md
json5 = md

[*]
BasedOnStyles = Vale, write-good, Readability, proselint, alex, neighbor, A11y, AiTells

Vale.Terms = NO
Readability = suggestion
HowTo.Opening = suggestion
HowTo.Steps = suggestion

[*.{php,js,ts,yaml,yml,json5}]
BasedOnStyles = Vale, write-good, Readability, proselint, alex, neighbor, A11y, AiTells, Reference

Vale.Terms = NO
Vale.Spelling = NO
Readability = suggestion
write-good.TooWordy = suggestion
write-good.Passive = suggestion
write-good.Weasel = suggestion
proselint.Very = suggestion
alex.ProfanityMaybe = suggestion
alex.ProfanityUnlikely = suggestion
alex.Ablist = suggestion
neighbor.AllCapsProse = suggestion

[CONTRIBUTING.md]
BasedOnStyles = Vale, write-good, Readability, proselint, alex, neighbor, A11y, AiTells, HowTo

[etc/ai/**.md]
BasedOnStyles = Vale, write-good, Readability, proselint, alex, neighbor, A11y, AiTells, Reference

[README.md]
BasedOnStyles = Vale, write-good, Readability, proselint, alex, neighbor, A11y, AiTells, Explanation
